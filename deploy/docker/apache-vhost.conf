# ============================================================
# AI Enterprise CRM —— Apache 虚拟主机配置
# ============================================================
<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SuiteCRM 前端路由（.htaccess 不生效时的兜底）
        RewriteEngine On
        RewriteBase /
    </Directory>

    # 保护敏感目录
    <DirectoryMatch "^/var/www/html/(cache|upload|data)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

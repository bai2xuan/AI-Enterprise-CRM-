; ============================================================
; AI Enterprise CRM —— PHP 运行参数
; ============================================================
date.timezone = Asia/Shanghai
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
default_charset = "UTF-8"

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On

session.gc_maxlifetime = 14400
